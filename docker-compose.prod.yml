services:
  app:
    image: ${DOCKER_IMAGE}:latest
    container_name: ${DOCKER_CONTAINER_NAME:-wardrobe-app}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
